<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alva · Prototypes</title>
<meta name="description" content="Interactive design prototypes for Alva — a list on the left, the running prototype on the right.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/logo-portrait2.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Delight-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/Delight-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="shell.css?v=12">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     One page, two layouts.

     ≥ 900px  → sidebar (the list) + stage (the running prototype)
     < 900px  → two views, list ⇄ prototype, switched by the hash,
                so the browser's own back gesture is the way back

     Each prototype runs inside an iframe sized to one real iPhone
     screen — which iPhone is the device switcher's business. The bezel
     around it is drawn here, by the shell — so the prototype itself is
     always in its full-screen mode and never renders a mockup of its
     own.
     ═══════════════════════════════════════════════════════════ -->

<div class="shell" id="shell">

  <!-- ── The list ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll">

      <header class="sb-head">
        <div class="wordmark">
          <img src="assets/wordmark-symbol.svg" class="wm-symbol" alt="">
          <img src="assets/wordmark-text.svg" class="wm-text" alt="Alva">
        </div>
        <h1>Prototypes</h1>
        <p class="sb-sub">Interactive design explorations. Each one is self-contained — open it, click through it, come back.</p>
      </header>

      <nav class="proto-list" id="protoList" aria-label="Prototypes"></nav>

      <p class="sb-foot" id="sbFoot"></p>

    </div>
  </aside>

  <!-- ── The running prototype ── -->
  <main class="stage" id="stage">

    <div class="stage-fit" id="stageFit">
      <div class="phone" aria-hidden="false">
        <div class="phone-buttons" aria-hidden="true">
          <span class="pb pb-action"></span>
          <span class="pb pb-volup"></span>
          <span class="pb pb-voldown"></span>
          <span class="pb pb-power"></span>
        </div>
        <div class="phone-screen" id="phoneScreen">
          <!-- shell.js mounts a fresh <iframe> here on every selection -->
        </div>
      </div>
    </div>

    <!-- Desktop-only stage chrome, outside the phone -->
    <div class="stage-bar stage-bar-left">
      <a class="stage-pill" id="figmaPill" href="#" target="_blank" rel="noopener" hidden>
        <span id="figmaPillText">Figma source</span><span class="pill-ico">↗</span>
      </a>
    </div>
    <div class="stage-bar stage-bar-right">
      <div class="device-group" role="radiogroup" aria-label="Phone size" id="deviceGroup">
        <span class="dg-readout" id="deviceReadout"></span>
        <!-- shell.js renders one segment per entry in DEVICES -->
      </div>
      <div class="stage-actions">
        <button class="stage-pill" id="restartPill">↺&nbsp; Restart</button>
        <a class="stage-pill" id="standalonePill" href="#" target="_blank" rel="noopener">Open standalone&nbsp; ↗</a>
      </div>
    </div>

  </main>

</div>

<script src="shell.js?v=12"></script>
</body>
</html>
